name: Windows portable EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-portable.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package*.json"

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:windows
      - run: npx playwright install chromium
      - run: npm run test:portable -- release/crazy-myangcade.exe
      - uses: actions/upload-artifact@v4
        with:
          name: crazy-myangcade-windows-x64
          path: release/windows-x64/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-portable-test-screen
          path: test-results/portable/
          retention-days: 7
